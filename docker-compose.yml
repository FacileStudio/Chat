services:
  cert-extractor:
    image: python:3-alpine
    container_name: cert-extractor
    restart: unless-stopped
    volumes:
      - /etc/dokploy/traefik/dynamic/acme.json:/acme.json:ro
      - ejabberd_ssl:/ssl
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          python3 -c "
        import json, base64, os
        try:
            with open('/acme.json') as f:
                data = json.load(f)
            for resolver, content in data.items():
                for c in content.get('Certificates', []):
                    domain = c.get('domain', {}).get('main')
                    if domain:
                        cert = base64.b64decode(c['certificate']).decode()
                        key = base64.b64decode(c['key']).decode()
                        out_path = f'/ssl/{domain}.pem'
                        with open(out_path, 'w') as out:
                            out.write(key + '\n' + cert)
                        os.chmod(out_path, 0o644)
        except Exception:
            pass
        "
          sleep 3600
        done

  ejabberd:
    image: ghcr.io/processone/ejabberd:latest
    container_name: ejabberd
    restart: unless-stopped
    depends_on:
      - cert-extractor
    ports:
      - "5222:5222"
      - "5269:5269"
    environment:
      - DOMAIN=${DOMAIN}
      - TURN_SECRET=${TURN_SECRET}
      - EJABBERD_MACRO_HOST=${DOMAIN}
      - EJABBERD_MACRO_TURN_SECRET=${TURN_SECRET}
      - REGISTER_ADMIN_PASSWORD=${ADMIN_PASSWORD:-${REGISTER_ADMIN_PASSWORD:-}}
    volumes:
      - ejabberd_data:/opt/ejabberd/database
      - ejabberd_upload:/opt/ejabberd/upload
      - ejabberd_ssl:/opt/ejabberd/ssl:ro
      - ./ejabberd.yml:/opt/ejabberd/conf/ejabberd.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ejabberd.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ejabberd.entrypoints=websecure"
      - "traefik.http.routers.ejabberd.tls.certresolver=letsencrypt"
      - "traefik.http.services.ejabberd.loadbalancer.server.port=5443"

  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --server-name=${DOMAIN}
      - --external-ip=${DOMAIN}
      - --min-port=49152
      - --max-port=49200
      - --fingerprint
      - --no-multicast-peers
      - --no-cli
      - --stale-nonce=600

volumes:
  ejabberd_data:
  ejabberd_upload:
  ejabberd_ssl:
